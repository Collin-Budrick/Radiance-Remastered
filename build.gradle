plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def isWindows = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")
def nativeResourceNames = ["core.dll", "core.lib", "libcore.so", "libxess.dll", "libxess_dx11.dll", "libxess_fg.dll"]
def mcvrSourceDir = providers.gradleProperty("radianceMcvrSourceDir")
        .map { file(it) }
        .orElse(layout.projectDirectory.dir("src/main/native/MCVR").asFile)
def mcvrBuildDir = providers.gradleProperty("radianceMcvrBuildDir")
        .map { file(it) }
        .orElse(layout.buildDirectory.dir("mcvr").map { it.asFile })
def nativeArtifactDirs = providers.gradleProperty("radianceNativeArtifactDirs")
        .map { dirs -> dirs.split(java.util.regex.Pattern.quote(File.pathSeparator)).collect { file(it) } }
        .orElse([
                file("src/main/resources"),
                file("src/main/native/artifacts/windows"),
                file("src/main/native/artifacts"),
                file("build/native/windows"),
                file("build/native")
        ])

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

compileJava {
    options.compilerArgs += ['-h', "${projectDir}/src/main/native/include"]
    outputs.upToDateWhen { false }
}

sourceSets {
    main {
        java {
            exclude 'com/radiance/mixins/vanilla_resource_tracker/AbstractTextureMixins.java'
            exclude 'com/radiance/mixins/vanilla_resource_tracker/BitmapFontGlyphMixins.java'
            exclude 'com/radiance/mixins/vanilla_resource_tracker/BuiltinEmptyGlyphMixins.java'
            exclude 'com/radiance/mixins/vanilla_resource_tracker/FontStorageMixins.java'
            exclude 'com/radiance/mixins/vanilla_resource_tracker/GlyphAtlasTextureMixins.java'
            exclude 'com/radiance/mixins/vanilla_resource_tracker/NativeImageBackedTextureMixins.java'
            exclude 'com/radiance/mixins/vanilla_resource_tracker/OverlayTextureMixins.java'
            exclude 'com/radiance/mixins/vanilla_resource_tracker/ReloadableTextureMixins.java'
            exclude 'com/radiance/mixins/vanilla_resource_tracker/SpriteAtlasTextureMixins.java'
            exclude 'com/radiance/mixins/vanilla_resource_tracker/SpriteContentsMixins.java'
            exclude 'com/radiance/mixins/vanilla_resource_tracker/SpriteMixins.java'
            exclude 'com/radiance/mixins/vanilla_resource_tracker/TextureUtilMixins.java'
            exclude 'com/radiance/mixins/vanilla_resource_tracker/TtfGlyphMixins.java'
            exclude 'com/radiance/mixins/vanilla_resource_tracker/UnicodeTextureGlyphMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/BannerBlockEntityRendererMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/AbstractTextureMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/BlockColorsMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/BlockModelRendererMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/BufferRendererMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/CloudRendererMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/CompiledShaderMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/EntityRenderDispatcherMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/EntityRendererMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/FluidRendererMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/GlStateManagerMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/HeldItemRendererMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/ItemRendererMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/LightningEntityRendererMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/ParticleManagerMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/RenderLayerMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/RenderPhaseLightmapMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/RenderPhaseMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/RenderPhaseTargetMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/ShaderLoaderMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/ShaderProgramMixins.java'
            exclude 'com/radiance/mixins/vulkan_render_integration/VideoWarningManagerWarningPatternLoaderMixins.java'
            exclude 'com/radiance/client/UnsafeManager.java'
            exclude 'com/radiance/mixin_related/extensions/vulkan_render_integration/IHeldItemRendererExt.java'
        }
    }
}

tasks.named("runClient", JavaExec) {
   args "--width", "1920", "--height", "1080"
   def radianceQuickPlayWorld = System.getProperty("radiance.quickPlayWorld")
   if (radianceQuickPlayWorld != null && !radianceQuickPlayWorld.isBlank()) {
       args "--quickPlaySingleplayer", radianceQuickPlayWorld
   }
   if (System.getProperty("radiance.renderer.required") == "true") {
       jvmArgs "-Dradiance.renderer.required=true"
   }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Mojang"
        url = "https://libraries.minecraft.net/"
    }
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // https://mvnrepository.com/artifact/org.yaml/snakeyaml
    implementation "org.yaml:snakeyaml:2.5"
    include "org.yaml:snakeyaml:2.5"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.register("configureMcvrWindows", Exec) {
    group = "radiance native"
    description = "Configure the external MCVR native renderer for Windows. Set -PradianceMcvrSourceDir if it is not under src/main/native/MCVR."
    dependsOn tasks.named("compileJava")

    doFirst {
        if (!isWindows) {
            throw new GradleException("configureMcvrWindows is only supported on Windows.")
        }
        if (!new File(mcvrSourceDir.get(), "CMakeLists.txt").isFile()) {
            throw new GradleException("MCVR source not found at ${mcvrSourceDir.get()}. Clone https://github.com/Minecraft-Radiance/MCVR there or pass -PradianceMcvrSourceDir=<path>.")
        }
    }

    commandLine "cmake",
            "-S", mcvrSourceDir.get().absolutePath,
            "-B", mcvrBuildDir.get().absolutePath,
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DJAVA_PROJECT_ROOT_DIR=${projectDir.absolutePath}",
            "-DMCVR_ENABLE_NRD=ON",
            "-DUSE_AMD=ON"
}

tasks.register("buildMcvrWindows", Exec) {
    group = "radiance native"
    description = "Build MCVR's Windows core native renderer."
    dependsOn tasks.named("configureMcvrWindows")

    commandLine "cmake",
            "--build", mcvrBuildDir.get().absolutePath,
            "-j",
            "--config", "Release"
}

tasks.register("installMcvrWindows", Exec) {
    group = "radiance native"
    description = "Install MCVR's Windows runtime artifacts into Radiance resource/package locations."
    dependsOn tasks.named("buildMcvrWindows")
    finalizedBy tasks.named("packageNativeResources")

    commandLine "cmake",
            "--install", mcvrBuildDir.get().absolutePath,
            "--config", "Release"
}

tasks.register("verifyNativeResources") {
    group = "radiance native"
    description = "Verify required native renderer runtime artifacts are available for packaging."

    doLast {
        def found = nativeArtifactDirs.get()
                .findAll { it.isDirectory() }
                .collectMany { dir -> nativeResourceNames.collect { new File(dir, it) } }
                .findAll { it.isFile() }
        if (isWindows && !found.any { it.name == "core.dll" }) {
            throw new GradleException("core.dll was not found for packaging. Run installMcvrWindows after cloning MCVR, or pass -PradianceNativeArtifactDirs=<dir${File.pathSeparator}dir> containing core.dll/core.lib.")
        }
    }
}

tasks.register("packageNativeResources", Sync) {
    group = "radiance native"
    description = "Stage native renderer runtime artifacts so they are packaged at the mod jar root."
    dependsOn tasks.named("verifyNativeResources")

    def outputDir = layout.buildDirectory.dir("generated/radianceNativeResources")
    into outputDir
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from({ nativeArtifactDirs.get().findAll { it.isDirectory() } }) {
        include nativeResourceNames
    }
}

tasks.named("processResources") {
    dependsOn tasks.named("packageNativeResources")
    from(tasks.named("packageNativeResources"))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

tasks.named("remapJar") {
    archiveFileName.set("${project.archives_base_name}-${project.version}-fabric-${project.minecraft_version}.jar")
}

tasks.named("remapSourcesJar") {
    archiveFileName.set("${project.archives_base_name}-${project.version}-fabric-${project.minecraft_version}-sources.jar")
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
